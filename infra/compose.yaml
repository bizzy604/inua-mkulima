name: inua-mkulima
services:
  rabbitmq:
    image: rabbitmq:4.1.4-management
    hostname: inua-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: inua
      RABBITMQ_DEFAULT_PASS: local-rabbitmq-only
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  loki:
    image: grafana/loki:3.5.5
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
volumes:
  rabbitmq-data:
  loki-data:
